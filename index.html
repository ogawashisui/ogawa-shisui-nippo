<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14576b"><title>小川試錐工業｜試錐日報</title><style>body{font-family:system-ui,sans-serif;background:#f1f5f6;margin:0;color:#172a32}header{background:#14576b;color:white;padding:20px}main{max-width:680px;margin:auto;padding:14px}section{background:white;padding:17px;border-radius:12px;margin-bottom:14px;box-shadow:0 1px 4px #0001}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0 0 12px}label{display:block;font-weight:600;margin:10px 0 4px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #aebdc4;border-radius:8px;padding:12px;font-size:16px;background:white}textarea{min-height:75px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two label{margin-top:10px}button{border:0;border-radius:9px;padding:13px;font-weight:700;font-size:16px;background:#e97728;color:white;margin:5px 5px 5px 0}button.secondary{background:#14576b}.muted{color:#536872;font-size:13px}.value{font-size:21px;font-weight:bold;color:#14576b}#print{display:none}@media print{header,main{display:none!important}#print{display:block;font:12px serif;color:#000}#print table{border-collapse:collapse;width:100%}#print td,#print th{border:1px solid black;padding:7px}#print h2{text-align:center;font-size:18px}@page{size:A4 landscape;margin:10mm}}@media print{#print{font-family:"Noto Sans JP",sans-serif!important;font-size:8px!important}#print table{table-layout:fixed}#print td,#print th{padding:3px!important;vertical-align:top;overflow-wrap:anywhere}#print h2{font-size:16px!important;margin:0 0 7px}.printmeta{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:5px 0}.printmeta span{border:1px solid #333;padding:4px}.dailygrid th{background:#eee}.dailygrid td{height:28px}.weekgrid td{height:115px}.columnsheet{height:230mm}.columnsheet td{height:8mm;padding:1px!important}.columnsheet th{font-size:7px}}@page{size:A4 landscape;margin:8mm}body.column-print #print{width:190mm;margin:auto}@media print{body.column-print #print{width:auto}@page{size:A4 portrait;margin:8mm}} </style><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><style>.appnav{position:sticky;top:0;z-index:5;display:flex;justify-content:space-around;background:#14576b;padding:6px;gap:4px}.appnav button{font-size:13px;background:#fff;color:#14576b;margin:0;flex:1;padding:12px 3px}@media print{.appnav{display:none!important}}</style><style>.inputgroup{border:1px solid #b8cbd0;border-radius:9px;margin:10px 0}.inputgroup summary{padding:16px;font-weight:bold;color:#14576b;cursor:pointer}.groupbody{padding:0 14px 14px}</style></head><body><header><h1>有限会社小川試錐工業</h1><div>試錐日報｜スマホ入力 <small>項目別入力 5</small></div></header><nav class="appnav"><button onclick="appTab(0)">日報入力</button><button onclick="appTab(1)">日報閲覧</button><button onclick="appTab(2)">週報</button><button id="installApp" hidden>アプリ追加</button></nav><main><section id="entryRoot"><h2>日報入力メニュー</h2><details class="inputgroup" ><summary>基本情報</summary><div class="groupbody"><input type="hidden" id="kind" value="土質"><label>調査名</label><input id="project"><label>地点名</label><input id="site"><label>試錐責任者</label><input id="person"><label>作業日</label><input type="date" id="date"><label>天候</label><input id="weather"><label>孔番号</label><input id="hole" placeholder="例：R08B-MT02N"><h3>作業前・作業後水位</h3><label>作業後水位（GL-m）</label><input id="waterLevel" type="number" step="0.01"><label>作業後測定時刻</label><input type="time" id="waterTime"><h3>作業内容・作業時間</h3><label>開始時刻</label><input type="time" id="startTime"><label>終了時刻</label><input type="time" id="endTime"><label>休憩（分）</label><input type="number" id="breakMin" value="60" min="0"><label>所定時間（時間）</label><input type="number" id="regular" value="8" step="0.5"><label>午前の作業</label><textarea id="amWork"></textarea><label>午後の作業</label><textarea id="pmWork"></textarea><input type="hidden" id="work"></div></details><details class="inputgroup" ><summary>使用機械</summary><div class="groupbody"><label>ボーリング機械</label><input id="machine"><label>ポンプ</label><input id="pump"><label>エンジン</label><input id="engine"></div></details><details class="inputgroup" ><summary>地層・掘削記録</summary><div class="groupbody"><input type="hidden" id="depthStart"><input type="hidden" id="depthEnd"><label>掘削記録（開始・終了深度）</label><div id="runs"></div><p id="depthSummary"></p><label>地層・岩種名</label><input id="layer"><label>色調</label><input id="color"><label>地層上端深度（m）</label><input id="layerFrom" type="number" step="0.01"><label>地層下端深度（m）</label><input id="layerTo" type="number" step="0.01"><button type="button" class="secondary" onclick="addRun()">掘削記録を追加</button></div></details><details class="inputgroup" ><summary>標準貫入試験</summary><div class="groupbody"><label>N値</label><input id="nValue" type="number" min="0"><label>SPT回数</label><input id="spt" type="number" min="0"><label>予備貫入（cm）</label><input id="prePen" type="number" min="0"><label>本貫入 10cm 打撃数</label><input id="spt1" type="number" min="0"><label>本貫入 20cm 打撃数</label><input id="spt2" type="number" min="0"><label>本貫入 30cm 打撃数</label><input id="spt3" type="number" min="0"></div></details><details class="inputgroup" ><summary>試料採取・原位置試験</summary><div class="groupbody"><label>TWS回数</label><input id="tws" type="number" min="0"><label>試験・地層記事</label><textarea id="testNotes"></textarea></div></details><details class="inputgroup" ><summary>備考</summary><div class="groupbody"><label>備考</label><textarea id="remarks"></textarea></div></details><details class="inputgroup" ><summary>日報保存・閲覧</summary><div class="groupbody"><input type="hidden" id="approval"><h2>自動計算</h2><div>日進量：<span class="value" id="advance">0.00 m</span></div><div>勤務時間：<span class="value" id="hours">0.00 時間</span></div><div>残業時間：<span class="value" id="overtime">0.00 時間</span></div><h2>保存・出力</h2><button onclick="save()">日報を保存</button><button class="secondary" onclick="previewDaily()">日報を閲覧</button><button class="secondary" onclick="printSpecial('daily')">日報を印刷</button><p class="muted">保存先はこの端末のブラウザです。端末間同期はありません。</p><button class="secondary" onclick="newReport()">新規日報</button></div></details></section><section><h2>週報</h2><label>対象週（月曜日から）</label><input type="date" id="weekDate"><button class="secondary" onclick="shiftWeek(-7)">前の週</button><button class="secondary" onclick="shiftWeek(7)">次の週</button><button onclick="printSpecial('weekly')">週報をPDFに保存</button><button class="secondary" onclick="previewWeek()">週報を閲覧</button><p class="muted">週報は保存済みの日報から自動集計します。</p></section><section><h2>過去の日報</h2><div id="history"></div></section></main><div id="preview" hidden><button onclick="closePreview()">入力画面へ戻る</button><button onclick="window.print()">印刷・PDF保存</button><div id="previewContent"></div></div><div id="print"><h2 id="printTitle"></h2><table id="printTable"></table></div><script>const fields=['kind','project','site','person','date','weather','startTime','endTime','breakMin','regular','depthStart','depthEnd','layer','color','machine','pump','engine','work','remarks','approval','hole','amWork','pmWork','nValue','spt','tws','layerFrom','layerTo','waterLevel','testNotes','waterTime','prePen','spt1','spt2','spt3'];const el=id=>document.getElementById(id);const read=()=>Object.fromEntries(fields.map(k=>[k,el(k).value]));function calc(){let a=Number(el('depthEnd').value)-Number(el('depthStart').value);el('advance').textContent=(Number.isFinite(a)?Math.max(0,a):0).toFixed(2)+' m';let s=el('startTime').value,e=el('endTime').value,h=0;if(s&&e){let toMin=x=>Number(x.slice(0,2))*60+Number(x.slice(3));let d=toMin(e)-toMin(s);if(d<0)d+=1440;h=Math.max(0,(d-Number(el('breakMin').value||0))/60)}el('hours').textContent=h.toFixed(2)+' 時間';el('overtime').textContent=Math.max(0,h-Number(el('regular').value||8)).toFixed(2)+' 時間';return {advance:Math.max(0,a||0).toFixed(2),hours:h.toFixed(2),overtime:Math.max(0,h-Number(el('regular').value||8)).toFixed(2)}}function all(){try{return JSON.parse(localStorage.getItem('ogawa_reports')||'[]')}catch{return []}}function save(){syncRuns();let d={...read(),...calc(),runs:getRuns(),id:editingId||Date.now(),number:reportNumber()};let x=all().filter(a=>a.id!==d.id);x.unshift(d);editingId=d.id;localStorage.setItem('ogawa_reports',JSON.stringify(x));render();alert('この端末に保存しました')}function load(id){let d=all().find(x=>x.id===id);if(!d)return;fields.forEach(k=>el(k).value=d[k]??'');editingId=d.id;el('runs').innerHTML='';(d.runs?.length?d.runs:[{from:d.depthStart,to:d.depthEnd,layer:d.layer}]).forEach(addRun);syncRuns();calc();scrollTo(0,0)}function remove(id){if(!confirm('この日報を削除しますか？'))return;localStorage.setItem('ogawa_reports',JSON.stringify(all().filter(x=>x.id!==id)));render()}function render(){el('history').innerHTML=all().map(x=>`<div style="padding:10px;border-bottom:1px solid #ddd"><b>${escapeHtml(x.date||'日付未設定')} ${escapeHtml(x.kind)}｜${escapeHtml(x.site||'地点未設定')}</b><br>No.${escapeHtml(x.number||"")}　日進 ${escapeHtml(x.advance)}m<br><button class="secondary" onclick="load(${x.id})">編集</button><button class="secondary" onclick="load(${x.id});previewDaily()">閲覧</button><button onclick="remove(${x.id})">削除</button></div>`).join('')||'保存済みの日報はありません'}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function downloadCsv(){let d={...read(),...calc()};let names={kind:'種類',project:'調査名',site:'地点名',person:'試錐責任者',date:'作業日',weather:'天候',startTime:'開始時刻',endTime:'終了時刻',breakMin:'休憩分',regular:'所定時間',depthStart:'開始深度',depthEnd:'終了深度',layer:'地層・岩種名',color:'色調',machine:'ボーリング機械',pump:'ポンプ',engine:'エンジン',work:'記事',remarks:'備考',approval:'承認',advance:'日進量',hours:'勤務時間',overtime:'残業時間'};let csv='\ufeff'+Object.keys(names).map(k=>[names[k],d[k]??''].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='試錐日報_'+(d.date||'未設定')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.querySelectorAll('input,textarea,select').forEach(x=>x.addEventListener('input',calc));el('date').value=new Date().toLocaleDateString('sv-SE');calc();render();</script><script>
let printMode='daily';
const iso=d=>{const x=new Date(d);return Number.isNaN(x.getTime())?'':x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
function monday(d){let x=new Date((d||iso(new Date()))+'T12:00:00');x.setDate(x.getDate()-(x.getDay()+6)%7);return iso(x)}
function shiftWeek(n){let x=new Date((el('weekDate').value||iso(new Date()))+'T12:00:00');x.setDate(x.getDate()+n);el('weekDate').value=monday(iso(x))}
function printSpecial(mode){printMode=mode;document.body.classList.toggle('column-print',mode==='column');window.print()}
function metadata(d){return `<div class="printmeta"><span>調査名：${escapeHtml(d.project)}</span><span>地点名：${escapeHtml(d.site)}</span><span>孔No.：${escapeHtml(d.hole)}</span><span>試錐責任者：${escapeHtml(d.person)}</span></div>`}
function dayPrint(){let d={...read(),...calc()},rock=d.kind==='岩盤';el('printTitle').textContent=rock?'岩盤ボーリング 作業日報':'土質ボーリング 作業日報';let heads=rock?['深度(m)','地層・岩種','色調','記事','採取長','コア採取率','RQD','掘進時間(h)','掘進速度','給圧','回転数','送水量','備考']:['深度(m)','土質名','色調','記事','孔内水位','SPT 10cm','SPT 20cm','SPT 30cm','N値','TWS','備考'];let vals=rock?[`${d.depthStart||''}～${d.depthEnd||''}`,d.layer,d.color,d.work,'','','','','','','', '',d.remarks]:[`${d.depthStart||''}～${d.depthEnd||''}`,d.layer,d.color,d.work,d.waterLevel,'','','',d.nValue,d.tws,d.remarks];el('printTable').outerHTML='<table id="printTable" class="dailygrid"><thead><tr>'+heads.map(x=>'<th>'+escapeHtml(x)+'</th>').join('')+'</tr></thead><tbody>'+[vals,...Array.from({length:8},()=>heads.map(()=>''))].map(row=>'<tr>'+row.map(x=>'<td>'+escapeHtml(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';el('printTitle').insertAdjacentHTML('afterend',metadata(d)+`<div class="printmeta"><span>作業日：${escapeHtml(d.date)}</span><span>天候：${escapeHtml(d.weather)}</span><span>作業時間：${escapeHtml(d.startTime)}～${escapeHtml(d.endTime)}</span><span>日進量：${escapeHtml(d.advance)} m</span><span>ボーリング機械：${escapeHtml(d.machine)}</span><span>ポンプ：${escapeHtml(d.pump)}</span><span>エンジン：${escapeHtml(d.engine)}</span><span>承認：${escapeHtml(d.approval)}</span></div>`)}
function weekPrint(){let d=read(),m=monday(el('weekDate').value||d.date||iso(new Date()));el('weekDate').value=m;let dates=Array.from({length:7},(_,i)=>{let x=new Date(m+'T12:00:00');x.setDate(x.getDate()+i);return iso(x)});let rec=all().filter(x=>x.project===d.project&&x.site===d.site&&(!d.hole||x.hole===d.hole));let cols=dates.map(date=>rec.filter(x=>x.date===date));el('printTitle').textContent='週報';let headers=['項目',...dates.map((x,i)=>'月火水木金土日'[i]+' '+x.slice(5)),'合計'];let cell=(v)=>'<td>'+escapeHtml(v)+'</td>';let rows=[['午前',...cols.map(a=>a.map(x=>x.amWork||x.work||'').join(' / ')),''],['午後',...cols.map(a=>a.map(x=>x.pmWork||'').join(' / ')),''],['日進(m)',...cols.map(a=>a.reduce((n,x)=>n+Number(x.advance||0),0).toFixed(2)),cols.flat().reduce((n,x)=>n+Number(x.advance||0),0).toFixed(2)],['SPT',...cols.map(a=>a.reduce((n,x)=>n+Number(x.spt||0),0)),cols.flat().reduce((n,x)=>n+Number(x.spt||0),0)],['TWS',...cols.map(a=>a.reduce((n,x)=>n+Number(x.tws||0),0)),cols.flat().reduce((n,x)=>n+Number(x.tws||0),0)]];el('printTable').outerHTML='<table id="printTable" class="weekgrid"><thead><tr>'+headers.map(x=>'<th>'+escapeHtml(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(cell).join('')+'</tr>').join('')+'</tbody></table>';el('printTitle').insertAdjacentHTML('afterend',metadata(d))}
function columnPrint(){let d=read(),rec=all().filter(x=>x.project===d.project&&x.site===d.site&&(!d.hole||x.hole===d.hole)).sort((a,b)=>Number(a.layerFrom||a.depthStart)-Number(b.layerFrom||b.depthStart));el('printTitle').textContent='簡易柱状図（確認用）';let heads=['標尺(m)','深度(m)','柱状図','土質・岩種','色調','記事','孔内水位','掘進記録','N値','標準貫入試験','原位置試験','試料採取','備考'];let total=Math.max(20,Math.ceil(Math.max(0,...rec.map(x=>Number(x.depthEnd)||0),Number(d.depthEnd)||0)/5)*5);let rows=Array.from({length:total},(_,i)=>{let a=rec.find(x=>i>=Number(x.layerFrom||x.depthStart||0)&&i<Number(x.layerTo||x.depthEnd||0));return [i+1,a?.layerTo||'',a?'▥':'',a?.layer||'',a?.color||'',a?.testNotes||a?.work||'',a?.waterLevel||'',a?.advance||'',a?.nValue||'',a?.spt||'',a?.tws||'','',a?.remarks||'']});el('printTable').outerHTML='<table id="printTable" class="columnsheet"><thead><tr>'+heads.map(x=>'<th>'+escapeHtml(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+escapeHtml(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';el('printTitle').insertAdjacentHTML('afterend',metadata(d)+`<div class="muted">掘削深度：${escapeHtml(d.depthEnd)}m　作成日：${iso(new Date())}　※確認用（地層境界・N値を確認してください）</div>`)}
window.addEventListener('beforeprint',()=>{document.querySelectorAll('#print>.printmeta,#print>.muted').forEach(x=>x.remove());if(printMode==='weekly')weekPrint();else if(printMode==='column')columnPrint();else dayPrint()});
window.addEventListener('afterprint',()=>{printMode='daily';document.body.classList.remove('column-print')});
el('weekDate').value=monday(iso(new Date()));
</script><style>#preview{padding:12px;overflow:auto;background:white}#previewContent{min-width:650px;color:black}#previewContent table{border-collapse:collapse;width:100%;table-layout:fixed}#previewContent td,#previewContent th{border:1px solid #333;padding:5px;white-space:pre-wrap;overflow-wrap:anywhere}.run{border:1px solid #abc;padding:10px;margin:8px 0;border-radius:8px}.run label{font-size:13px}.reportfooter{text-align:right;margin-top:8px}@media print{#preview{display:none!important}body{background:white}#print td{white-space:pre-wrap}.weekgrid td{height:auto!important}.weekgrid tr:nth-child(2) td,.weekgrid tr:nth-child(3) td{height:30mm!important}}</style><style id="paper"></style><script>
let editingId=null;
const runFields=[['from','開始深度(m)','number'],['to','終了深度(m)','number'],['layer','地層・岩種','text'],['start','掘削開始時刻','time'],['end','掘削終了時刻','time'],['rpm','回転数(rpm)','number'],['core','採取長(m)','number'],['recovery','コア採取率(%)','number'],['rqd','RQD(%)','number'],['pressure','給圧','number'],['flow','送水量','number']];
function addRun(d={}){let box=document.createElement('div');box.className='run';box.innerHTML='<div class="two">'+runFields.filter(([k])=>!['sptDepth','blow1','blow2','blow3'].includes(k)).map(([k,l,t])=>'<div><label>'+l+'</label><input data-key="'+k+'" type="'+t+'" '+(t==='number'?'step="any"':'')+' value="'+escapeHtml(d[k]??'')+'"></div>').join('')+'</div><button type="button" class="secondary">行削除</button>';box.querySelector('button').onclick=()=>{box.remove();syncRuns()};box.oninput=syncRuns;el('runs').append(box);syncRuns()}
function getRuns(){return [...document.querySelectorAll('.run')].map(r=>Object.fromEntries([...r.querySelectorAll('input')].map(i=>[i.dataset.key,i.value])))}
function same(a,b){return a.project===b.project&&a.site===b.site&&a.hole===b.hole}
function prior(){let d=read();return all().filter(a=>same(a,d)&&a.date<d.date).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function syncRuns(){let r=getRuns(),valid=r.filter(a=>a.from!==''&&a.to!=='');el('depthStart').value=valid[0]?.from??prior()?.depthEnd??'';el('depthEnd').value=valid.at(-1)?.to??el('depthStart').value;el('work').value=[el('amWork').value,el('pmWork').value].filter(Boolean).join('\n');el('depthSummary').textContent='開始 '+el('depthStart').value+' m / 終了 '+el('depthEnd').value+' m';calc()}
function reportNumber(){let d=read(),old=all().find(a=>a.id===editingId);return old?.number??(Math.max(0,...all().filter(a=>same(a,d)).map(a=>Number(a.number)||0))+1)}
function newReport(){let p=read();editingId=null;fields.forEach(k=>{if(!['project','site','person','hole','machine','pump','engine','regular','breakMin','kind'].includes(k))el(k).value=''});el('date').value=iso(new Date());el('runs').innerHTML='';addRun({from:prior()?.depthEnd??''});syncRuns();scrollTo(0,0)}
for(let k of ['project','site','hole','date'])el(k).addEventListener('change',()=>{let first=el('runs').querySelector('[data-key=from]');if(first&&!editingId&&first.value==='')first.value=prior()?.depthEnd??'';syncRuns()});
