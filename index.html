<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14576b"><title>小川試錐工業｜試錐日報</title><style>body{font-family:system-ui,sans-serif;background:#f1f5f6;margin:0;color:#172a32}header{background:#14576b;color:white;padding:20px}main{max-width:680px;margin:auto;padding:14px}section{background:white;padding:17px;border-radius:12px;margin-bottom:14px;box-shadow:0 1px 4px #0001}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0 0 12px}label{display:block;font-weight:600;margin:10px 0 4px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #aebdc4;border-radius:8px;padding:12px;font-size:16px;background:white}textarea{min-height:75px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two label{margin-top:10px}button{border:0;border-radius:9px;padding:13px;font-weight:700;font-size:16px;background:#e97728;color:white;margin:5px 5px 5px 0}button.secondary{background:#14576b}.muted{color:#536872;font-size:13px}.value{font-size:21px;font-weight:bold;color:#14576b}#print{display:none}@media print{header,main{display:none!important}#print{display:block;font:12px serif;color:#000}#print table{border-collapse:collapse;width:100%}#print td,#print th{border:1px solid black;padding:7px}#print h2{text-align:center;font-size:18px}@page{size:A4 landscape;margin:10mm}}</style></head><body><header><h1>有限会社小川試錐工業</h1><div>試錐日報｜スマホ入力</div></header><main><section><h2>基本情報</h2><label>日報の種類</label><select id="kind"><option>土質</option><option>岩盤</option></select><label>調査名</label><input id="project"><label>地点名</label><input id="site"><label>試錐責任者</label><input id="person"><label>作業日</label><input type="date" id="date"><label>天候</label><input id="weather"><div class="two"><div><label>開始時刻</label><input type="time" id="startTime"></div><div><label>終了時刻</label><input type="time" id="endTime"></div></div><div class="two"><div><label>休憩（分）</label><input type="number" id="breakMin" value="60" min="0"></div><div><label>所定時間（時間）</label><input type="number" id="regular" value="8" step="0.5"></div></div></section><section><h2>掘削・機械</h2><div class="two"><div><label>開始深度（m）</label><input type="number" step="0.01" id="depthStart"></div><div><label>終了深度（m）</label><input type="number" step="0.01" id="depthEnd"></div></div><label>地層・岩種名</label><input id="layer"><label>色調</label><input id="color"><label>ボーリング機械</label><input id="machine"><label>ポンプ</label><input id="pump"><label>エンジン</label><input id="engine"><label>記事・作業内容</label><textarea id="work"></textarea><label>備考</label><textarea id="remarks"></textarea></section><section><h2>自動計算</h2><div>日進量：<span class="value" id="advance">0.00 m</span></div><div>勤務時間：<span class="value" id="hours">0.00 時間</span></div><div>残業時間：<span class="value" id="overtime">0.00 時間</span></div><label>承認</label><select id="approval"><option>未承認</option><option>承認済み</option></select></section><section><h2>保存・出力</h2><button onclick="save()">日報を保存</button><button class="secondary" onclick="window.print()">PDFに保存・印刷</button><button class="secondary" onclick="downloadCsv()">Excelで開けるCSV</button><a href="template.xlsx" download><button class="secondary">Excel原本を取得</button></a><p class="muted">この初期版のPDFは簡易印刷様式です。原本と同じ罫線への自動転記は未実装です。保存データはこの端末のブラウザ内に保存され、別の端末とは同期されません。</p></section><section><h2>過去の日報</h2><div id="history"></div></section></main><div id="print"><h2 id="printTitle"></h2><table id="printTable"></table></div><script>const fields=['kind','project','site','person','date','weather','startTime','endTime','breakMin','regular','depthStart','depthEnd','layer','color','machine','pump','engine','work','remarks','approval'];const el=id=>document.getElementById(id);const read=()=>Object.fromEntries(fields.map(k=>[k,el(k).value]));function calc(){let a=Number(el('depthEnd').value)-Number(el('depthStart').value);el('advance').textContent=(Number.isFinite(a)?Math.max(0,a):0).toFixed(2)+' m';let s=el('startTime').value,e=el('endTime').value,h=0;if(s&&e){let toMin=x=>Number(x.slice(0,2))*60+Number(x.slice(3));let d=toMin(e)-toMin(s);if(d<0)d+=1440;h=Math.max(0,(d-Number(el('breakMin').value||0))/60)}el('hours').textContent=h.toFixed(2)+' 時間';el('overtime').textContent=Math.max(0,h-Number(el('regular').value||8)).toFixed(2)+' 時間';return {advance:Math.max(0,a||0).toFixed(2),hours:h.toFixed(2),overtime:Math.max(0,h-Number(el('regular').value||8)).toFixed(2)}}function all(){try{return JSON.parse(localStorage.getItem('ogawa_reports')||'[]')}catch{return []}}function save(){let d={...read(),...calc(),id:Date.now()};let x=all();x.unshift(d);localStorage.setItem('ogawa_reports',JSON.stringify(x));render();alert('この端末に保存しました')}function load(id){let d=all().find(x=>x.id===id);if(!d)return;fields.forEach(k=>el(k).value=d[k]??'');calc();scrollTo(0,0)}function remove(id){if(!confirm('この日報を削除しますか？'))return;localStorage.setItem('ogawa_reports',JSON.stringify(all().filter(x=>x.id!==id)));render()}function render(){el('history').innerHTML=all().map(x=>`<div style="padding:10px;border-bottom:1px solid #ddd"><b>${escapeHtml(x.date||'日付未設定')} ${escapeHtml(x.kind)}｜${escapeHtml(x.site||'地点未設定')}</b><br>${escapeHtml(x.approval)}　日進 ${escapeHtml(x.advance)}m<br><button class="secondary" onclick="load(${x.id})">再利用</button><button onclick="remove(${x.id})">削除</button></div>`).join('')||'保存済みの日報はありません'}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function downloadCsv(){let d={...read(),...calc()};let names={kind:'種類',project:'調査名',site:'地点名',person:'試錐責任者',date:'作業日',weather:'天候',startTime:'開始時刻',endTime:'終了時刻',breakMin:'休憩分',regular:'所定時間',depthStart:'開始深度',depthEnd:'終了深度',layer:'地層・岩種名',color:'色調',machine:'ボーリング機械',pump:'ポンプ',engine:'エンジン',work:'記事',remarks:'備考',approval:'承認',advance:'日進量',hours:'勤務時間',overtime:'残業時間'};let csv='\ufeff'+Object.keys(names).map(k=>[names[k],d[k]??''].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='試錐日報_'+(d.date||'未設定')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.querySelectorAll('input,textarea,select').forEach(x=>x.addEventListener('input',calc));window.addEventListener('beforeprint',()=>{let d={...read(),...calc()};el('printTitle').textContent=d.kind+'ボーリング 作業日報';let labels={project:'調査名',site:'地点名',person:'試錐責任者',date:'作業日',weather:'天候',startTime:'開始時刻',endTime:'終了時刻',depthStart:'開始深度(m)',depthEnd:'終了深度(m)',advance:'日進量(m)',layer:'地層・岩種名',color:'色調',machine:'ボーリング機械',pump:'ポンプ',engine:'エンジン',work:'記事・作業内容',remarks:'備考',hours:'勤務時間(h)',overtime:'残業(h)',approval:'承認'};el('printTable').innerHTML=Object.keys(labels).map(k=>'<tr><th>'+labels[k]+'</th><td>'+escapeHtml(d[k])+'</td></tr>').join('')});el('date').value=new Date().toLocaleDateString('sv-SE');calc();render();</script></body></html>
